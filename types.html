<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختر المقاس</title>
    <style>
        body { background-color: rgb(0, 13, 17); color: white; font-family: sans-serif; text-align: center; }
        .tools { list-style: none; padding: 50px 0; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        /* تـعـديـل: إضافة cursor pointer لضمان عمل الزرار */
        .tools a { 
            display: inline-block; 
            padding: 15px 40px; 
            border: 2px solid #071f29; 
            color: #3affaa; 
            text-decoration: none; 
            border-radius: 50px; 
            font-size: 24px; 
            font-weight: bold; 
            cursor: pointer; 
            user-select: none;
        }
        .tools a:hover { background: #3affaa; color: black; }
    </style>
</head>
<body>
    <h2 id="msg">حدد المقاس لـ: </h2>
    <ul class="tools">
         <li><a href="javascript:void(0)" onclick="finish('فرخ كامل')">فرخ كامل</a></li>
         <li><a href="javascript:void(0)" onclick="finish('نص فرخ')">نص فرخ</a></li>
         <li><a href="javascript:void(0)" onclick="finish('ربع فرخ')">ربع فرخ</a></li>
         <li><a href="javascript:void(0)" onclick="finish('A3')">A3</a></li>
         <li><a href="javascript:void(0)" onclick="finish('A4')">A4</a></li>
         <li><a href="javascript:void(0)" onclick="finish('تمن')">تمن</a></li>
    </ul>

    <script>
        const t = localStorage.getItem('temp_type') || "غير محدد"; // تأمين لو القيمة فاضية
        document.getElementById('msg').innerText = "حدد المقاس لـ: " + t;

        function finish(size) {
            const qty = localStorage.getItem('temp_qty') || "1";
            let cart = JSON.parse(localStorage.getItem('userCart')) || [];
            
            cart.push({ type: t, size: size, qty: qty });
            localStorage.setItem('userCart', JSON.stringify(cart));
            
            alert("تمت إضافة (" + size + ") للسلة بنجاح!");
            window.location.href = 'index.html'; 
        }
    </script>
</body>
</html>
