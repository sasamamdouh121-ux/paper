<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>السلة النهائية</title>
    <style>
        body { background: #0d1117; color: white; text-align: center; font-family: sans-serif; padding: 20px; }
        .box { background: #161b22; padding: 20px; border-radius: 12px; border: 1px solid #30363d; display: inline-block; width: 100%; max-width: 450px; }
        .cart-list { text-align: right; background: #0d1117; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #30363d; }
        input { display: block; width: 100%; padding: 12px; margin: 10px 0; background: #0d1117; color: white; border: 1px solid #30363d; border-radius: 5px; box-sizing: border-box; }
        button { background: #238636; color: white; border: none; padding: 15px; width: 100%; cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 18px; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color:#3affaa">محتويات السلة</h2>
        <div id="display" class="cart-list">السلة فارغة</div>

        <input type="text" id="name" placeholder="اسمك">
        <input type="tel" id="phone" placeholder="رقم الموبايل">
        
        <button id="sendBtn">اطلب الآن 🚀</button>
        <button onclick="localStorage.removeItem('userCart'); location.reload();" style="background:none; color:red; margin-top:10px; font-size:12px; border:none; cursor:pointer;">تفريغ السلة</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCKOL2J5tOU_z1_B_i9vPlf1qDteW85fc4",
            databaseURL: "https://paper-90c73-default-rtdb.firebaseio.com",
            projectId: "paper-90c73"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const cart = JSON.parse(localStorage.getItem('userCart')) || [];
        if(cart.length > 0) {
            document.getElementById('display').innerHTML = cart.map(i => `• ${i.type} (${i.size}) × ${i.qty}`).join('<br>');
        }

        document.getElementById('sendBtn').onclick = function() {
            const uName = document.getElementById('name').value;
            const uPhone = document.getElementById('phone').value;

            if(uName && uPhone && cart.length > 0) {
                push(ref(db, 'orders'), {
                    customerName: uName,
                    customerPhone: uPhone,
                    orderItems: cart, // السلة كاملة هتوصل هنا
                    time: new Date().toLocaleString('ar-EG')
                }).then(() => {
                    alert("طلبك وصل يا بطل!");
                    localStorage.removeItem('userCart');
                    window.location.href = 'index.html';
                });
            } else {
                alert("بياناتك ناقصة أو السلة فاضية!");
            }
        }
    </script>
</body>
</html>
