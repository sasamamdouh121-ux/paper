<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الورق - الرئيسية</title>
    <style>
        body { 
            background-color: rgb(0, 13, 17); 
            color: white; 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 0;
        }

        /* تنسيق السلة */
        .cart-float { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            background: #3affaa; 
            color: black; 
            padding: 10px 20px; 
            border-radius: 10px; 
            text-decoration: none; 
            font-weight: bold; 
            z-index: 1000;
        }

        /* --- تـعـديـل: زرار الأدمن رجع فوق --- */
        .admin-btn-top {
            position: absolute;
            top: 20px;
            left: 20px; /* خليه على الشمال عشان السلة على اليمين */
            padding: 8px 20px;
            border: 1px solid #da3633;
            color: #da3633;
            text-decoration: none;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            transition: 0.3s;
        }
        .admin-btn-top:hover { background: #da3633; color: white; }

        .welcome { margin-top: 80px; }

        .whatsapp-p { font-size: 14px; color: #ddd; margin-bottom: 20px; }

        /* تنسيق الصورة (اللوجو) */
        .i {
            display: block;
            max-width: 150px; 
            height: auto;
            margin: 0 auto 10px auto;
            border-radius: 15px;
        }

        /* زرار الطلب */
        .btn-order {   
            margin-top: 30px;
            display: inline-block; 
            padding: 18px 50px; 
            background: #033646;
            color: white; 
            text-decoration: none; 
            border-radius: 50px; 
            font-size: 24px; 
            font-weight: bold; 
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(3,54,70,0.4);
        }
        .btn-order:hover { background: #04495e; transform: scale(1.05); }
    
    </style>
</head>
<body>
    <a href="controlpanel.html" class="admin-btn-top">ADMIN</a>

    <a href="page.html" class="cart-float">🛒 السلة (<span id="cartCount">0</span>)</a>
    
    <div class="welcome">
        <h1>أهلاً بك في متجر الورق</h1>
        <p class="whatsapp-p">Whatsapp: +20 11 00623263</p>
        
        <img class="i" src="IMG-20260420-WA0004.jpg" alt="Logo">
        
        <br>
        <a href="papper.html" class="btn-order">ابدأ الطلب الآن</a>
    </div>

    <script>
        function updateCart() {
            const cart = JSON.parse(localStorage.getItem('userCart')) || [];
            document.getElementById('cartCount').innerText = cart.length;
        }
        updateCart();
    </script>
</body>
</html>
